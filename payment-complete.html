<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Payment Received</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { --green: #2F6B44; --gold: #E8A020; --ink: #2D1B0E; --muted: #6B5B4E; --line: #E8D4BC; --bg: #FFFBF5; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; padding: 24px 16px;
    }
    .card {
      width: 100%; max-width: 460px; background: #fff; border: 1px solid var(--line);
      border-radius: 20px; padding: 40px 28px 32px; text-align: center;
      box-shadow: 0 16px 40px rgba(45, 27, 14, 0.08);
    }
    .icon {
      width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800;
    }
    .icon.ok { background: #EAF2EC; color: var(--green); }
    .icon.stop { background: #FFF4E0; color: #B87A10; }
    h1 { font-size: 26px; line-height: 1.2; margin: 0 0 10px; color: var(--green); }
    h1.stop { color: var(--ink); }
    .amount { font-size: 34px; font-weight: 800; color: var(--green); margin: 6px 0 14px; }
    p { font-size: 15px; line-height: 1.6; color: var(--muted); margin: 0 auto 14px; max-width: 360px; }
    .note { font-size: 13px; color: #9B8574; margin-top: 22px; }
    .bar { height: 5px; border-radius: 999px; background: linear-gradient(90deg, var(--green) 0 65%, var(--gold) 65%); margin-top: 26px; }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="icon ok" id="icon">&#10003;</div>
    <h1 id="title">Payment received</h1>
    <div class="amount" id="amount" style="display:none;"></div>
    <p id="msg">Thank you. Your payment went through, and your invoice will be marked as paid automatically.</p>
    <p class="note">Payments are processed securely by Stripe. You can safely close this page.</p>
    <div class="bar"></div>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var status = params.get('status');
      var amt = parseFloat(params.get('amount'));

      if (status === 'canceled') {
        document.title = 'Payment Not Completed';
        var icon = document.getElementById('icon');
        icon.className = 'icon stop';
        icon.textContent = '!';
        var title = document.getElementById('title');
        title.textContent = 'Payment not completed';
        title.className = 'stop';
        document.getElementById('msg').textContent =
          'No payment was taken and you have not been charged. When you are ready, open your invoice link again to pay.';
        return;
      }

      if (status === 'upgraded') {
        document.title = 'Welcome to BizHQ Pro';
        document.getElementById('title').textContent = 'You’re on BizHQ Pro';
        document.getElementById('msg').textContent =
          'Thank you. Your upgrade went through. Close BizHQ completely and open it again to see Pro unlocked.';
        return;
      }

      if (!isNaN(amt) && amt > 0) {
        var el = document.getElementById('amount');
        el.textContent = '$' + amt.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        el.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
